services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: urban_furniture_accounting
      POSTGRES_USER: urbanbooks
      POSTGRES_PASSWORD: urbanbooks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@urbanbooks.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: urban_furniture_accounting
      POSTGRES_USER: urbanbooks
      POSTGRES_PASSWORD: urbanbooks
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - postgres

volumes:
  postgres_data:
