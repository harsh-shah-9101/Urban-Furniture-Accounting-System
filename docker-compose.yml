services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: urban_furniture_accounting
      POSTGRES_USER: urbanbooks
      POSTGRES_PASSWORD: urbanbooks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@urbanbooks.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://urbanbooks:urbanbooks@postgres:5432/urban_furniture_accounting
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
